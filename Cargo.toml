[workspace]
resolver = "3"
# `examples/*` joins when the first whole-server example crate does: Cargo refuses a member
# pattern that matches no folder.
members = ["crates/*", "xtask"]
# Throwaway probes keep their own lock files and builds (P1.S0).
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# teta-wot v0.2.0's minimum. The pinned toolchain is in rust-toolchain.toml.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/lucaswewa/Tetera"
publish = false

[workspace.dependencies]
tetera-acquire = { path = "crates/tetera-acquire" }
tetera-api = { path = "crates/tetera-api" }
tetera-compute = { path = "crates/tetera-compute" }
tetera-core = { path = "crates/tetera-core" }
tetera-hal = { path = "crates/tetera-hal" }
tetera-imaging = { path = "crates/tetera-imaging" }
tetera-log = { path = "crates/tetera-log" }
tetera-pipeline = { path = "crates/tetera-pipeline" }
tetera-sim = { path = "crates/tetera-sim" }

# Each at least two weeks old when added (ADR-0002).
# Errors at the HTTP boundary, as teta-wot's actions and hooks take them (P1.13a).
anyhow = "1.0.100"
# The server's command line (P1.13a).
clap = { version = "4.6.0", features = ["derive"] }
# Tetera's HTTP interface; `tetera-api` alone depends on it (ADR-0004).
teta-wot = { git = "https://github.com/lucaswewa/teta-wot", tag = "v0.2.0" }
# The server's runtime, as teta-wot's (P1.13a).
tokio = { version = "1.47.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# CUDA, loaded at run time, so the workspace builds without the toolkit (ADR-0009).
cudarc = { version = "0.19.10", default-features = false, features = ["std", "cuda-13030", "dynamic-loading", "driver", "nvrtc", "cufft"] }
libloading = "0.9.0"
proptest = "1.12.0"
rayon = "1.12.0"
# FFTs for deconvolution on the CPU (P1.07b).
rustfft = "6.4.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The objective catalogue, `configs/objectives.toml` (P1.09b).
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
# libjpeg-turbo, built from source with its SIMD code: it needs cmake and nasm (P1.05b).
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake", "require-simd"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt", "ansi", "env-filter"] }
uuid = { version = "1.29.2", features = ["v7", "serde"] }
# The preview stream's WebSocket client, in tests and examples, as axum's own (P1.14b).
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.29.0"

# Every crate takes these with `[lints] workspace = true`, except the few allowed unsafe
# code, which set their own (ADR-0005). The gates turn warnings into errors.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies are built optimised in dev and test builds: they rarely change, and the
# simulator and image code that use them run much faster (ADR-0005).
[profile.dev.package."*"]
opt-level = 2
