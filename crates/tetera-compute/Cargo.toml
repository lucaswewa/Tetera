[package]
name = "tetera-compute"
description = "Tetera's compute backends: the CPU reference and CUDA, chosen at run time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# CUDA, loaded at run time: it builds without the toolkit, and runs only where a driver is.
cuda = ["dep:cudarc", "dep:libloading"]

[dependencies]
cudarc = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
rayon.workspace = true
tetera-core.workspace = true

# Allowed unsafe code (plan §5.3, ADR-0005), so the workspace's lints are repeated here with
# `unsafe_code` allowed, and every `unsafe` block must say why it is sound.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
