teta-wot.workspace = true
tetera-acquire.workspace = true
tetera-compute.workspace = true
tetera-core.workspace = true
tetera-hal.workspace = true
tetera-imaging.workspace = true
tetera-jobs.workspace = true
tetera-sim.workspace = true
tetera-store.workspace = true
tetera-workflows.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
