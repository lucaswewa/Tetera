# cargo-mutants' settings (ADR-0005). Each exclusion is a mutant no test can tell from the
# original, with the reason. Add one only with its reason, and say so in the phase's notes.
exclude_re = [
    # A command's time limit: `>` and `>=` differ only for a command still running at the
    # exact poll that reaches the limit.
    "replace > with >= in run_logged",
    # Whether a checkpoint works out a merge base: it only feeds `--mutants`' diff, which
    # every checkpoint run with `--mutants` exercises.
    "replace && with \\|\\| in work_out_reach",
    "delete ! in work_out_reach",
    # The fresh clone runs `cargo xtask` inside a clone of this workspace, so no scratch
    # workspace can stand in for it; every checkpoint gate runs it for real.
    "replace fresh_clone ->",
    "in fresh_clone$",
    # The wall clock before 1970: no test machine's clock reads that.
    "delete - in UtcTime::now",
    # Readers of TETERA_CUDA and TETERA_FORCE_CPU: the mutants run sets the first, and tests
    # can't safely set environment variables. `env_flag` is tested; the manual test runs
    # compute_info with TETERA_FORCE_CPU=1.
    "replace cuda_tests_enabled -> bool",
    "replace <impl Probe for SystemProbe>::force_cpu -> bool",
    # A grid made larger, for a tile kernel or colour: the kernel's own bounds check idles
    # the extra threads.
    "replace / with \\* in device::CudaBackend::tiles_kernel",
    "replace / with \\* in device::CudaBackend::colour",
    # Reading (x - dx, y - dy) for (x + dx, y + dy): every demosaic filter is point-symmetric,
    # so the taps sum the same.
    "replace \\+ with - in demosaic_cpu",
    # The test pattern's bands: a pixel's centre, y + 0.5, never falls on a third of a whole
    # height, so < and <= draw the same bands.
    "replace < with <= in test_pattern",
    # The noise generator's uniform draw adds 1 to stay above zero for the logarithm: it
    # matters only for a draw of exactly zero, which no seed gives.
    "replace \\+ with (-|\\*) in noisy",
    # How many values a parallel task takes in deconvolution: it changes only how fast it runs.
    "replace per_task -> usize with 1",
    "replace / with (\\*|%) in per_task",
    # The fused step's tables taken as stale every run: made again, the same preview, slower.
    "replace == with != in .*<impl Step for FusedStep>::run",
    # The fake camera's schedule: `<` and `<=` differ only at the very instant a frame is due.
    "replace < with <= in <impl Camera for FakeCamera>::start",
    # The camera contract's too-long exposure, twice the longest: each mutant of its
    # arithmetic is an exposure out of range too, refused the same.
    "replace [/*] with [%*+] in camera::bad_configurations_are_refused",
    # The contract's snap at 1 ms becomes one at 1 s: an exposure the camera takes too, and
    # the snap's checks are the same.
    "replace / with % in camera::a_snap_is_the_configured_frame",
    # The stage contract's step: `from × 100` or `from / 100` for `from + 100` or `from - 100`
    # is another target within the travel, which tests a move as well.
    "replace \\+ with \\* in step_from",
    "replace - with / in step_from",
    # The fake stage's jog: a speed of zero is refused before its direction is chosen.
    "replace > with >= in <impl Stage for FakeStage>::jog",
    # A motion profile's segments meet: at a boundary, the segment ending and the one
    # starting give the same distance and speed.
    "replace < with <= in Profile::along",
    # The virtual stage's legs meet the same way: at a boundary, the leg ending and the one
    # starting give the same position.
    "replace < with <= in Plan::leg",
    # The virtual stage's jog: a speed of zero is refused before its direction is chosen.
    "replace > with >= in <impl Stage for VirtualStage>::jog",
    # The H&E sample's shortcuts: past a nucleus's or a red cell's edge, and where a region
    # is absent, the stain is zero whether or not the code returns early.
    "replace > with (>=|==) in HeSample::nucleus_density",
    "replace > with (>=|==) in HeSample::red_cell_density",
    "replace > with >= in HeSample::column",
    # Ties with no area: noise exactly at a fold's edge, and two feature points exactly as
    # far from a point.
    "replace < with <= in HeSample::folded",
    "replace < with <= in cellular",
    # The 3 × 3 cells around a point are the same whichever way they are walked.
    "replace \\+ with - in Grid<T>::around",
    # A last layer of no thickness adds nothing.
    "replace < with <= in point",
    # Half precision: the fields `|` joins share no bit, so `^` joins them the same; and at
    # exactly the smallest normal half, the subnormal path gives the same bits.
    "replace \\| with \\^ in (to_f32|from_f32)",
    "replace < with <= in from_f32",
    # The H&E kernels' buffers: one allocated too small is written out of bounds, which no
    # test can see without a sanitizer. compute-sanitizer's memcheck runs the GPU tests clean
    # (P1.11b's notes).
    "replace \\* with (\\+|/) in device::CudaBackend::he_(cells|render)",
    # The CPU field's blur: its weights are symmetric, so read the other way round they blur
    # the same; and one closure makes both passes, so a sign flipped in it flips back.
    "replace \\+ with - in blur",
    "replace \\+= with -= in blur",
    # No blur below a σ of 1e-3 pixels: at exactly 1e-3, a blur of three weights rounds to one.
    "replace < with <= in gaussian",
    # The sensor's Poisson draw: at a mean of exactly 16 both draws have its mean and
    # variance; the inversion stops where a uniform draw equals the sum, which has
    # probability zero, and its cap of 64 counts is reached with probability about 1e-20.
    "replace > with >= in poisson",
    "replace < with <= in poisson",
    # The virtual camera's velocity over a frame's span: the span is never zero, as the
    # shortest exposure is 0.1 ms, so `>` and `>=` divide alike.
    "replace > with >= in Shared::render_here",
    # The camera Thing's binning and ROI: the virtual camera offers no binning but its modes'
    # and no ROI, so each is always its default, `1 × 1` and `null`.
    "replace CameraThing::binning -> Result<Binning, PropertyError> with Ok\\(Default::default\\(\\)\\)",
    "replace CameraThing::roi -> Result<Option<Rect>, PropertyError> with Ok\\(None\\)",
]
